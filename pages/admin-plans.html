<!DOCTYPE html>
<html>
<head>
    <title>Quantum Motion — Admin Plans</title>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="../css/admin-plans.css">
</head>
<body>

    <header>
        <h1>Quantum Motion — <span>Admin Panel</span></h1>
        <p>Welcome back, Admin</p>
    </header>
    <hr>

    <div class="wrapper">
        <aside>
            <h2>Navigation</h2>
            <nav>
                <ul>
                    <li><a href="admin-dashboard.html">📊 Dashboard</a></li>
                    <li><a href="memberships.html">👥 Members</a></li>
                    <li><a href="contact.html">🏋️ Contact</a></li>
                    <li><a href="admin-plans.html" class="active">💳 Plans</a></li>
                    <li><a href="trainers.html">🥊 Trainers</a></li>
                    <li><a href="#">📦 Orders</a></li>
                </ul>
            </nav>
        </aside>

        <main>
            <section class="table-section">
                <h2>Membership Plans</h2>
                <table>
                    <thead>
                        <tr>
                            <th>Plan Name</th>
                            <th>Price</th>
                            <th>Duration</th>
                            <th>Description</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="plans-tbody"></tbody>
                </table>
                <p id="no-plans" class="no-plans-msg" style="display:none;">No plans yet. Add one below!</p>
            </section>

            <hr>

            <section class="form-section">
                <h2 id="form-title">Add New Plan</h2>
                <input type="hidden" id="edit-index" value="-1">
                <div class="plan-form">
                    <label for="plan-name">Plan Name:</label>
                    <input type="text" id="plan-name" placeholder="e.g. Bronze">
                    <span id="err-name" class="err"></span>

                    <label for="price">Price ($):</label>
                    <input type="number" id="price" placeholder="e.g. 10" min="0">
                    <span id="err-price" class="err"></span>

                    <label for="duration">Duration:</label>
                    <input type="text" id="duration" placeholder="e.g. monthly / quarterly / yearly">
                    <span id="err-duration" class="err"></span>

                    <label for="description">Description:</label>
                    <input type="text" id="description" placeholder="e.g. Basic gym access">
                    <span id="err-desc" class="err"></span>

                    <div class="form-buttons">
                        <button onclick="savePlan()">Save Plan</button>
                        <button class="cancel-btn" onclick="resetForm()">Cancel</button>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="../js/admin-plans.js"></script>
</body>
</html>
